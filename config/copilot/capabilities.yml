###### Captain Copilot + WebMCP capability catalog #######
# id: unique capability identifier (also used as RubyLLM tool name)
# title: Human-readable name
# description_key: i18n key under captain.capabilities.*
# domain: logical grouping
# exposure: [copilot, webmcp]
# webmcp_mode: declarative | imperative
# route: dashboard route pattern (for frontend filtering)
# permission: administrator | agent | custom role permission string
# copilot_execution: server (default) | client (defer to browser via tool_results bridge)
# params: tool parameter schema
# handler.service: Captain::Capabilities::* service class
#########################################################

# --- Conversations (read) ---
- id: search_conversations
  title: Search Conversations
  description_key: captain.capabilities.search_conversations
  domain: conversations
  exposure: [copilot, webmcp]
  webmcp_mode: imperative
  permission: conversation_access
  params:
    query:
      type: string
      required: false
      description: Search query for conversation content or contact
    status:
      type: string
      required: false
      description: Filter by status (open, resolved, pending, snoozed)
    inbox_id:
      type: integer
      required: false
      description: Filter by inbox ID
  handler:
    service: Captain::Capabilities::Conversations::Search

- id: get_conversation
  title: Get Conversation
  description_key: captain.capabilities.get_conversation
  domain: conversations
  exposure: [copilot, webmcp]
  webmcp_mode: imperative
  permission: conversation_access
  params:
    conversation_id:
      type: integer
      required: true
      description: Display ID of the conversation
  handler:
    service: Captain::Capabilities::Conversations::Get

# --- Conversation actions (write) ---
- id: resolve_conversation
  title: Resolve Conversation
  description_key: captain.capabilities.resolve_conversation
  domain: conversations
  exposure: [copilot, webmcp]
  webmcp_mode: imperative
  permission: conversation_access
  params:
    conversation_id:
      type: integer
      required: true
      description: Display ID of the conversation
    reason:
      type: string
      required: false
      description: Brief reason for resolving
  handler:
    service: Captain::Capabilities::Conversations::Resolve

- id: add_label_to_conversation
